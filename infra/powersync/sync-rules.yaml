# EMDO Sync Streams template (the filename is retained from the approved plan).
# Compatibility target: PowerSync Service 1.23.3, Sync Streams edition 3.
#
# Every stream is constrained by the signed JWT subject via auth.user_id().
# There is deliberately no global or client-parameter-authorized stream.
# Explicit output columns prevent a future source-table column from becoming
# replicated merely because it was added to PostgreSQL.

config:
  edition: 3

streams:
  current_households:
    auto_subscribe: true
    query: |
      SELECT
        h.id,
        h.name,
        h.created_by_user_id,
        h.created_at,
        h.updated_at
      FROM "emdo"."households" AS h
      INNER JOIN "emdo"."household_memberships" AS m
        ON m.household_id = h.id
      WHERE m.user_id = auth.user_id()
        AND m.status = 'active'

  private_space_data:
    auto_subscribe: true
    with:
      authorized_private_spaces: |
        SELECT s.id
        FROM "emdo"."spaces" AS s
        INNER JOIN "emdo"."household_memberships" AS m
          ON m.household_id = s.household_id
        WHERE m.user_id = auth.user_id()
          AND m.status = 'active'
          AND s.visibility = 'private'
          AND s.original_owner_user_id = auth.user_id()
    queries:
      - |
        SELECT
          s.id,
          s.household_id,
          s.original_owner_user_id,
          s.name,
          s.visibility,
          s.revision,
          s.tombstoned_at,
          s.created_at,
          s.updated_at
        FROM "emdo"."spaces" AS s
        WHERE s.id IN authorized_private_spaces
      - |
        SELECT
          r.id,
          r.household_id,
          r.space_id,
          r.original_owner_user_id,
          r.record_kind,
          r.payload,
          r.actor_intent,
          r.revision,
          r.tombstoned_at,
          r.created_at,
          r.updated_at
        FROM "emdo"."space_records" AS r
        WHERE r.space_id IN authorized_private_spaces
      - |
        SELECT
          e.id,
          e.household_id,
          e.space_id,
          e.original_owner_user_id,
          e.conversation_id,
          e.client_event_id,
          e.sequence,
          e.event_type,
          e.payload,
          e.occurred_at,
          e.purge_after
        FROM "emdo"."conversation_events" AS e
        WHERE e.space_id IN authorized_private_spaces
      - |
        SELECT
          a.id,
          a.household_id,
          a.space_id,
          a.original_owner_user_id,
          a.actor_user_id,
          a.session_id,
          a.request_id,
          a.run_id,
          a.proposal_id,
          a.event_type,
          a.payload,
          a.occurred_at,
          a.retain_until
        FROM "emdo"."audit_events" AS a
        WHERE a.space_id IN authorized_private_spaces

  shared_space_data:
    auto_subscribe: true
    with:
      authorized_shared_spaces: |
        SELECT s.id
        FROM "emdo"."spaces" AS s
        INNER JOIN "emdo"."household_memberships" AS m
          ON m.household_id = s.household_id
        WHERE m.user_id = auth.user_id()
          AND m.status = 'active'
          AND s.visibility = 'shared'
    queries:
      - |
        SELECT
          s.id,
          s.household_id,
          s.original_owner_user_id,
          s.name,
          s.visibility,
          s.revision,
          s.tombstoned_at,
          s.created_at,
          s.updated_at
        FROM "emdo"."spaces" AS s
        WHERE s.id IN authorized_shared_spaces
      - |
        SELECT
          r.id,
          r.household_id,
          r.space_id,
          r.original_owner_user_id,
          r.record_kind,
          r.payload,
          r.actor_intent,
          r.revision,
          r.tombstoned_at,
          r.created_at,
          r.updated_at
        FROM "emdo"."space_records" AS r
        WHERE r.space_id IN authorized_shared_spaces
      - |
        SELECT
          e.id,
          e.household_id,
          e.space_id,
          e.original_owner_user_id,
          e.conversation_id,
          e.client_event_id,
          e.sequence,
          e.event_type,
          e.payload,
          e.occurred_at,
          e.purge_after
        FROM "emdo"."conversation_events" AS e
        WHERE e.space_id IN authorized_shared_spaces
      - |
        SELECT
          a.id,
          a.household_id,
          a.space_id,
          a.original_owner_user_id,
          a.actor_user_id,
          a.session_id,
          a.request_id,
          a.run_id,
          a.proposal_id,
          a.event_type,
          a.payload,
          a.occurred_at,
          a.retain_until
        FROM "emdo"."audit_events" AS a
        WHERE a.space_id IN authorized_shared_spaces
