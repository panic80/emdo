# Opt-in Finance document staging boundary. This file is intentionally not
# selected by the generic staging launcher; a Finance-authorized run must add
# it explicitly and provide fresh, run-scoped credential files and storage.
services:
  api:
    env_file: !override
      - '${SECRETS_DIR:?SECRETS_DIR must point to staging credentials}/api.env'
      - '${SECRETS_DIR:?SECRETS_DIR must point to staging credentials}/edge-proxy.env'
      - path: '${FINANCE_STAGING_API_ENV_FILE:?FINANCE_STAGING_API_ENV_FILE must point to a run-scoped finance-api env file}'
        required: true
    environment:
      EMDO_FINANCE_SYNTHETIC_STAGING: 'true'
      EMDO_FINANCE_DOCUMENT_STORE_DIR: /var/lib/emdo/finance-documents
    volumes:
      - type: bind
        source: '${FINANCE_STAGING_DOCUMENT_STORE_DIR:?FINANCE_STAGING_DOCUMENT_STORE_DIR must point to a run-scoped finance document store outside the repository}'
        target: /var/lib/emdo/finance-documents
        read_only: false
        bind:
          create_host_path: false

  staging-acceptance:
    environment:
      EMDO_FINANCE_SYNTHETIC_STAGING: 'true'
      EMDO_STAGING_API_ORIGIN: 'http://127.0.0.1:3000'
      # This mount exposes the pre-created, run-scoped handoff only to the
      # ephemeral acceptance process. It contains session material only after
      # the final owner/member/document/evidence checks have completed.
    volumes:
      - type: bind
        source: '${FINANCE_STAGING_RESTORE_VERIFIER_INPUT_FILE:?FINANCE_STAGING_RESTORE_VERIFIER_INPUT_FILE must point to the pre-created run-scoped Finance restore verifier handoff}'
        target: /run/emdo/finance-restore/finance-staging-restore-verifier-input.env
        read_only: false
        bind:
          create_host_path: false
    network_mode: service:api

  synthetic-data:
    environment:
      EMDO_FINANCE_SYNTHETIC_STAGING: 'true'

  finance-extraction:
    image: '${WORKER_IMAGE:?WORKER_IMAGE must be an immutable application image reference}'
    restart: 'no'
    init: true
    user: '10001:10001'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: '${FINANCE_STAGING_EXTRACTION_ENV_FILE:?FINANCE_STAGING_EXTRACTION_ENV_FILE must point to a run-scoped finance-extraction env file}'
        required: true
    environment:
      EMDO_ENVIRONMENT: staging
      EMDO_FINANCE_DOCUMENT_STORE_DIR: /var/lib/emdo/finance-documents
    command:
      - node
      - dist/cli/finance-document-extraction.js
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: '${FINANCE_STAGING_DOCUMENT_STORE_DIR:?FINANCE_STAGING_DOCUMENT_STORE_DIR must point to a run-scoped finance document store outside the repository}'
        target: /var/lib/emdo/finance-documents
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - finance-extraction-egress
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
          pids: 64
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

networks:
  # This is the sole non-internal network available to the narrowly scoped
  # extraction process; it does not grant the general worker provider access.
  finance-extraction-egress:
    name: emdo-staging-${STAGING_RUN_ID:?STAGING_RUN_ID is required}-finance-extraction-egress
