<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="EMDO household personal assistant" />
    <script>
      // Resolve the theme before first paint so the app never flashes the wrong one.
      // Mirrors resolveTheme() in src/features/theme/theme.store.ts.
      (function () {
        try {
          var stored = localStorage.getItem('emdo-theme-preference');
        } catch (error) {
          stored = null;
        }
        var resolved =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = resolved;
        if (resolved === 'dark') {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#0f1419');
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/emdo-mark.svg" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <title>EMDO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
